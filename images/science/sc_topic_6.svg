<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#sky)"/>
  
  <!-- 4 Seasons split soft arches -->
  <rect x="0" y="0" width="160" height="360" fill="#fbcfe8"/>
  <rect x="160" y="0" width="160" height="360" fill="#bae6fd"/>
  <rect x="320" y="0" width="160" height="360" fill="#fed7aa"/>
  <rect x="480" y="0" width="160" height="360" fill="#1e293b"/>
  <!-- Spring Sakura -->
  <circle cx="80" cy="140" r="46" fill="#f472b6"/><rect x="72" y="180" width="16" height="80" fill="#78350f"/>
  <rect x="0" y="255" width="160" height="105" fill="#4ade80"/>
  <!-- Summer Sun & Sea -->
  <circle cx="240" cy="82" r="28" fill="#facc15"/>
  <rect x="160" y="245" width="160" height="115" fill="#0ea5e9"/>
  <!-- Autumn Maple -->
  <circle cx="400" cy="145" r="46" fill="#ea580c"/><rect x="392" y="185" width="16" height="75" fill="#78350f"/>
  <rect x="320" y="255" width="160" height="105" fill="#fdba74"/>
  <!-- Winter Moon & Snowman -->
  <circle cx="565" cy="72" r="22" fill="#fef08a"/>
  <rect x="480" y="255" width="160" height="105" fill="#f8fafc"/>
  <circle cx="560" cy="236" r="26" fill="#ffffff"/><circle cx="560" cy="196" r="18" fill="#ffffff"/>

</svg>
